[package]
name = "feishu_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
feishu-ws = "0.1.0"
futures-util = "0.3.34"
lapin = { version = "4", features = ["tokio"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.2.2"
